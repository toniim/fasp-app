version: '3'

# Wails v3 build tasks. Run them with `wails3 <task>` (wails3 build, wails3 package,
# wails3 dev) or through the Makefile targets, which also stamp the version.

vars:
  APP_NAME: "fasp"
  # Same output folder as with Wails v2: build/bin/fasp.app, fasp.exe, the installer.
  BIN_DIR: "build/bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS and is overridden
  # by `wails3 build GOOS=windows` for cross-compilation.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build (macOS .app bundle, Windows NSIS installer)
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
