name: Build

# Compile-only pipeline for both platforms. It exists mainly to catch macOS
# (cgo / Objective-C) breakage, which cannot be built on Windows.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            # ScreenCaptureKit screenshots need macOS 14. Wails only adds its
            # own 10.13 target when these flags carry none.
            cgo_flags: -mmacosx-version-min=14.0
          - os: windows-latest
            platform: windows/amd64
            cgo_flags: ''

    runs-on: ${{ matrix.os }}
    env:
      CGO_CFLAGS: ${{ matrix.cgo_flags }}
      CGO_LDFLAGS: ${{ matrix.cgo_flags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Pinned to the version in go.mod: newer CLIs regenerate bindings that
      # the project does not track yet.
      - name: Install Wails
        shell: bash
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # main.go embeds frontend/dist, so the Go package cannot even be built
      # (or tested) until the frontend has been compiled once.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run Go tests
        run: go test ./...

      - name: Build
        run: wails build -platform ${{ matrix.platform }}
