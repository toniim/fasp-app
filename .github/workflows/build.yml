name: Build

# Compile-only pipeline for both platforms. It exists mainly to catch macOS
# (cgo / Objective-C) breakage, which cannot be built on Windows.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_cmd: wails3 task darwin:package:universal
            # ScreenCaptureKit screenshots need macOS 14 (the Taskfile sets the
            # same target for the app build; this covers `go test`).
            cgo_flags: -mmacosx-version-min=14.0
          - os: windows-latest
            build_cmd: wails3 build GOOS=windows GOARCH=amd64
            cgo_flags: ''

    runs-on: ${{ matrix.os }}
    env:
      CGO_CFLAGS: ${{ matrix.cgo_flags }}
      CGO_LDFLAGS: ${{ matrix.cgo_flags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Wails v3 needs Go 1.26: go.mod pins the toolchain (not Go 1.27).
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Pinned to the version in go.mod: the CLI generates the bindings the
      # frontend imports and must match the runtime library.
      - name: Install Wails
        shell: bash
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # main.go embeds frontend/dist, so the Go package cannot even be built
      # (or tested) until the frontend has been compiled once.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run Go tests
        run: go test ./...

      - name: Build
        shell: bash
        run: ${{ matrix.build_cmd }}

      # Same packaging as the release, so a broken macOS download shows up on
      # the pull request rather than after tagging.
      - name: Sign ad-hoc and package (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/package-macos.sh build/bin/fasp-macos-universal.zip

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/smoke-macos.sh build/bin/fasp-macos-universal.zip

      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: fasp-macos-universal
          path: build/bin/fasp-macos-universal.zip
          retention-days: 7
