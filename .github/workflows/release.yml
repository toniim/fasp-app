name: Release

# Cut a release by pushing a tag that matches the version in version.go, e.g.
#   ./scripts/release.sh
# This builds the Windows app and installer and the macOS app, then publishes
# them together as one GitHub Release.
#
# Running it by hand (Actions > Release > Run workflow) builds everything and
# keeps the files as workflow artifacts without publishing a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pinned to the version in go.mod: newer CLIs regenerate bindings that
      # the project does not track yet.
      - name: Install Wails
        shell: bash
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install NSIS
        shell: bash
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Build Windows app
        shell: bash
        run: |
          VERSION=$(./scripts/stamp-version.sh)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version.go ($VERSION)"; exit 1
          fi
          BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S')
          GIT_COMMIT=$(git rev-parse HEAD)
          echo "Building $VERSION ($GIT_COMMIT)"
          # -webview2 download: the installer fetches & installs the WebView2
          # runtime from Microsoft at install time if it isn't already present.
          wails build -platform windows/amd64 -nsis -webview2 download -ldflags "\
            -X 'github.com/heytonyne/fasp/internal/version.Version=${VERSION}' \
            -X 'github.com/heytonyne/fasp/internal/version.BuildTime=${BUILD_TIME}' \
            -X 'github.com/heytonyne/fasp/internal/version.GitCommit=${GIT_COMMIT}'"

      # --- Optional code signing via SignPath (free for OSS) ---
      # Skipped unless the repo variable SIGNPATH_ORGANIZATION_ID is set, so the
      # release stays green (publishing unsigned) until SignPath is configured.
      # To enable, set repo variables SIGNPATH_ORGANIZATION_ID,
      # SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG and secret SIGNPATH_API_TOKEN.
      - name: Upload unsigned artifact (for SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows
          path: |
            build/bin/fasp.exe
            build/bin/fasp-amd64-installer.exe

      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Overwrite the unsigned binaries with the signed ones so the
          # artifact below carries the signed versions.
          output-artifact-directory: build/bin

      - name: Keep Windows files for publishing
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            build/bin/fasp.exe
            build/bin/fasp-amd64-installer.exe
          if-no-files-found: error

  release-macos:
    runs-on: macos-latest
    env:
      # ScreenCaptureKit screenshots need macOS 14. Wails only adds its own
      # 10.13 target when these flags carry none.
      CGO_CFLAGS: -mmacosx-version-min=14.0
      CGO_LDFLAGS: -mmacosx-version-min=14.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build macOS app (Intel + Apple Silicon)
        run: |
          VERSION=$(./scripts/stamp-version.sh)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version.go ($VERSION)"; exit 1
          fi
          BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S')
          GIT_COMMIT=$(git rev-parse HEAD)
          echo "Building $VERSION ($GIT_COMMIT)"
          wails build -platform darwin/universal -ldflags "\
            -X 'github.com/heytonyne/fasp/internal/version.Version=${VERSION}' \
            -X 'github.com/heytonyne/fasp/internal/version.BuildTime=${BUILD_TIME}' \
            -X 'github.com/heytonyne/fasp/internal/version.GitCommit=${GIT_COMMIT}'"

      # Ad-hoc signed and not notarized: there is no Apple Developer ID yet.
      # Users clear Gatekeeper once; see README, "Install > macOS".
      - name: Sign ad-hoc and package
        run: ./scripts/package-macos.sh build/bin/fasp-macos-universal.zip

      - name: Smoke test (app stays up)
        run: ./scripts/smoke-macos.sh

      - name: Keep macOS files for publishing
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: build/bin/fasp-macos-universal.zip
          if-no-files-found: error

  publish:
    needs: [release-windows, release-macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Collect release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/fasp.exe
            dist/fasp-amd64-installer.exe
            dist/fasp-macos-universal.zip
